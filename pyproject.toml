[project]
name = "ai-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.5.0",
    "crewai-tools>=1.15.16",
    "langchain-community>=0.4.2",
]

[project.scripts]
ai-agents = "ai_agents:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as slow integration tests requiring external services (Ollama, internet)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
